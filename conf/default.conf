# Echte Client-Adresse für die Limits unten – nur vom Reverse Proxy auf dem Host, der über
# das Gateway des Compose-Netzes kommt (siehe compose.yml). Ohne Proxy greift das nicht.
set_real_ip_from 172.30.10.1;
real_ip_header X-Forwarded-For;

# Grundschutz gegen Fluten: Anfragen an PHP pro Client. Großzügig, weil eine ganze Schule
# oft hinter einer einzigen öffentlichen IP sitzt. Laravel drosselt Login & Co. zusätzlich.
limit_req_zone $binary_remote_addr zone=loan_php:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=loan_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 14m;
    charset utf-8;

    # Langsame Clients nicht ewig offen halten (Slowloris)
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn loan_conn 40;

    # Sicherheits-Header (CSP & Co. setzt Laravel selbst)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hochgeladene Dateien (storage/app/public) – nie als PHP ausführen
    location ^~ /storage/ {
        alias /var/www/storage-public/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        expires 7d;
        location ~ \.php$ { return 404; }
    }

    # Vite-Build: Dateinamen enthalten Hash → lange cachen
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location = /index.php {
        limit_req zone=loan_php burst=100 nodelay;

        include fastcgi_params;
        # Laravel bekommt weiter die Adresse des Proxys und wertet X-Forwarded-For selbst aus
        # (TRUSTED_PROXIES) – realip oben gilt nur für die nginx-Limits
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_pass loan_app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Keine anderen PHP-Dateien ausführen
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
