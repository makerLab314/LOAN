; PHP-FPM-Pool für LOAN. Das Docker-Image startet sonst mit höchstens 5 Prozessen –
; dann reichen wenige langsame Anfragen (Login, Mailversand, Bild-Upload), und alle warten.
; Speicher: im Mittel ~40 MB je Prozess, Bild-Uploads kurzzeitig bis memory_limit (384 MB).
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Prozesse regelmäßig erneuern (Speicherlecks in Erweiterungen)
pm.max_requests = 500
; Hängende Anfragen hart beenden (etwas über max_execution_time / fastcgi_read_timeout)
request_terminate_timeout = 70s
