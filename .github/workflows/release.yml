name: Release

# Neues Release: git tag v2.1.0 && git push origin v2.1.0
# → Tests laufen, Image wird nach ghcr.io gebaut, GitHub-Release mit Änderungen wird angelegt.
# Tags mit Bindestrich (v2.1.0-rc.1) gelten als Vorabversion und bekommen kein "latest".

on:
  push:
    tags: ['v*']

concurrency: release-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LOAN_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          # Abschnitt dieser Version aus CHANGELOG.md – GitHub setzt ihn vor die automatischen Notizen
          awk -v tag="$GITHUB_REF_NAME" '
            found && /^## / { exit }
            $1 == "##" && $2 == tag { found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file release-notes.md $prerelease
