# LOAN – Docker Compose
# Konfiguration erfolgt ausschließlich über die Datei .env (siehe .env.example / UPGRADE.md).

x-app: &app
  # Fertiges Image aus dem Release (setzt ./deploy.sh). Mit "docker compose build" bzw.
  # "./deploy.sh --build" entsteht es stattdessen lokal unter demselben Namen.
  image: ${LOAN_IMAGE:-ghcr.io/makerlab314/loan}:${LOAN_VERSION:-latest}
  build:
    context: .
    target: production
  restart: unless-stopped
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    LOG_CHANNEL: stderr
    BACKUP_PATH: /var/backups/loan
  volumes:
    - ./data/storage:/var/www/html/storage/app
    - ./data/backups:/var/backups/loan
  depends_on:
    db:
      condition: service_healthy

services:
  loan:
    <<: *app
    container_name: loan_app
    volumes:
      - ./data/storage:/var/www/html/storage/app
      - ./data/backups:/var/backups/loan
      - public_assets:/var/www/public-shared
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && php artisan about --only=environment >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scheduler:
    <<: *app
    container_name: loan_scheduler
    # Wie php-fpm als www-data, damit Backups und Cache-Dateien dieselben Rechte haben
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      loan:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      # Standard: nur lokal erreichbar (Reverse Proxy auf demselben Host). Ohne Proxy: APP_BIND=0.0.0.0
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
      - ./data/storage/public:/var/www/storage-public:ro
    depends_on:
      loan:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:11
    container_name: loan_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD in .env setzen}
      MARIADB_DATABASE: ${DB_DATABASE:-loan}
      MARIADB_USER: ${DB_USERNAME:-loan}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      # Nach einem neueren MariaDB-Image die Systemtabellen anpassen und bei alten
      # Datenbanken den Benutzer für den Healthcheck nachrüsten
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  public_assets:
